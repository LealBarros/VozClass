<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>VozClass - Canal de Comunicação</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f8; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        h2 { color: #2b5c8f; }
        textarea { width: 100%; height: 80px; margin-top: 10px; }
        button { background-color: #2b5c8f; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>VozClass: Professor - Estudante</h2>
        <label for="duvida"><b>Envie sua dúvida ou sugestão para o professor:</b></label>
        <textarea id="duvida" placeholder="Digite sua pergunta aqui..."></textarea>
        <br><br>
        <button onclick="alert('Dúvida enviada com sucesso!')">Enviar Pergunta</button>
    </div>
</body>
</html>
